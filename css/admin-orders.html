<!DOCTYPE html>
<html>
<head>
<title>Orders Management</title>

<link rel="stylesheet" href="styles.css">

<style>

body{
background:#f4f7fa;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:15px 30px;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.logo{
font-weight:700;
font-size:20px;
}

.search{
padding:10px;
border-radius:8px;
border:1px solid #ddd;
width:250px;
}

.nav-links{
display:flex;
gap:25px;
font-weight:600;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;
}

.stat-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.stat-number{
font-size:26px;
font-weight:700;
}

.table-container{
margin-top:25px;
background:white;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.05);
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
text-align:left;
padding:15px;
background:#f1f4f7;
font-size:14px;
}

td{
padding:18px 15px;
border-bottom:1px solid #eee;
}

.status{
padding:6px 14px;
border-radius:20px;
font-size:12px;
font-weight:600;
display:inline-block;
}

.placed{
background:#ffe6b3;
color:#a96b00;
}

.preparing{
background:#dff3ff;
color:#0084c7;
}

.served{
background:#d7f7e6;
color:#2b9d64;
}

.cancelled{
background:#ffd7d7;
color:#d60000;
}

.ready{
color:#27ae60;
font-weight:700;
}

.warning{
color:red;
font-weight:700;
}

.add-btn{
background:#2bb5c7;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

.wait-input{
width:50px;
padding:5px;
border:1px solid #ccc;
border-radius:5px;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">Smart Canteen</div>

<button onclick="history.back()" class="back-btn">
← Back
</button>
</div>

<div class="container">

<h1>Orders Management</h1>
<p>Manage real-time food tokens and update order status.</p>

<div class="stats">

<div class="stat-card">
<div>Total Today</div>
<div class="stat-number" id="totalOrders">0</div>
</div>

<div class="stat-card">
<div>Pending</div>
<div class="stat-number" id="pendingOrders">0</div>
</div>

<div class="stat-card">
<div>Preparing</div>
<div class="stat-number" id="preparingOrders">0</div>
</div>

<div class="stat-card">
<div>Served</div>
<div class="stat-number" id="servedOrders">0</div>
</div>

</div>

<div class="table-container">

<table>

<thead>
<tr>
<th>TOKEN ID</th>
<th>FOOD ITEMS</th>
<th>CURRENT STATUS</th>
<th>REMAINING TIME</th>
<th>ADD WAITING TIME</th>
<th>ACTION</th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>

</table>

</div>

</div>

<script type="module">
    import { db } from "./firebase.js";

import {
collection,
onSnapshot,
doc,
updateDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

let orders = [];
function renderOrders(){
let table=document.getElementById("ordersTable")
table.innerHTML=""

let pending=0
let preparing=0
let served=0

orders.forEach(order=>{

if(order.status === "SERVED"){
    return;
}

let elapsed = Math.floor(
    (Date.now() - order.startTime)/60000
);

let remain = Math.max(
    0,
    order.initialETA +
    (order.extraTime || 0) -
    elapsed
);
if(order.served){

    order.status="SERVED";

}
else if(remain==0){

    order.status="READY";

}
else if(elapsed>=2){

    order.status="PREPARING";

}
else{

    order.status="PLACED";

}
let remainText="";

if(order.status==="CANCELLED"){
remainText="--";
}
else if(remain==0){
remainText="<span class='ready'>Ready</span>";
}
else if(remain<5){
remainText="<span class='warning'>"+remain+" mins</span>";
}
else{
remainText=remain+" mins";
}

if(order.status==="PLACED") pending++
if(order.status==="PREPARING") preparing++
if(order.status==="SERVED") served++
served = orders.filter(order => order.status === "SERVED").length;
table.innerHTML+=`

<tr>

<td>${order.token}</td>

<td>${order.item}</td>

<td>
<span class="status ${order.status.toLowerCase()}">
${order.status}
</span>
</td>

<td>${remainText}</td>

<td>

<input
class="wait-input"
id="add${order.id}"
placeholder="min"
${order.status==="CANCELLED"?"disabled":""}
>

<button
class="add-btn"
onclick="addTime('${order.id}')"
${order.status==="CANCELLED"?"disabled":""}
>
Add
</button>

</td>
<td>

${
order.status !== "SERVED"

?

`<button
class="add-btn"
onclick="markServed('${order.id}')">
Served
</button>`

:

""

}

</td>
</tr>

`

})

let activeOrders = orders.filter(o => o.status !== "SERVED");

document.getElementById("totalOrders").innerText = activeOrders.length;
document.getElementById("pendingOrders").innerText = pending;
document.getElementById("preparingOrders").innerText = preparing;
document.getElementById("servedOrders").innerText = served;

}

async function addTime(id){

    let order = orders.find(o => o.id === id);

    let input = document.getElementById("add" + id);

    let value = parseInt(input.value);

    if(isNaN(value)) return;

    let elapsed = Math.floor(
        (Date.now() - order.startTime) / 60000
    );

    let currentRemaining = Math.max(
        0,
        order.initialETA +
        (order.extraTime || 0) -
        elapsed
    );

    await updateDoc(doc(db,"orders",id),{

        extraTime: (order.extraTime || 0) + value,

        remainingTime: currentRemaining + value

    });

    input.value = "";

}
async function markServed(id){

    await updateDoc(doc(db,"orders",id),{

        status:"SERVED",
        served:true,
        servedTime:Date.now()

    });

}
onSnapshot(collection(db,"orders"),(snapshot)=>{

    orders=[];

    snapshot.forEach((docSnap)=>{

        orders.push({

            id:docSnap.id,

            ...docSnap.data()

        });

    });

    renderOrders();
});
window.addTime = addTime;
window.markServed = markServed;

setInterval(renderOrders,60000);

</script>

</body>
</html>
